name: Build and Release WolfBot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # کش پوشه پکیج‌ها بر اساس go.mod
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.mod') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-

    - name: Compile WolfBot Binary
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o wolfbot .
        ls -lh wolfbot

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "WolfBot Latest Release"
        files: wolfbot
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_unmatched_files: true
