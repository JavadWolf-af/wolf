name: Build and Release WolfBot

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Compile WolfBot Binary
      run: |
        export GOPROXY=https://goproxy.io,direct
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o wolfbot .

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "WolfBot Latest Release"
        files: wolfbot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
